name: Alist
options:
  bundleIdPrefix: com.alist
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "654JRWH9J7"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    INFOPLIST_KEY_NSCameraUsageDescription: "Alist 需要访问相机以扫描二维码登录"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Alist 需要访问相册以上传图片"
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Alist 需要保存下载的图片到相册"
    INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Alist 需要访问文件以下载和上传"
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Alist 需要访问本地网络以连接到你的服务器"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIRequiresFullScreen: NO
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 7.0.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.0.0
  CodeScanner:
    url: https://github.com/twostraws/CodeScanner
    from: 2.5.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.0
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: 5.8.0
targets:
  Alist:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: Alist
        PRODUCT_BUNDLE_IDENTIFIER: com.s1mon09.alist
        CODE_SIGN_ENTITLEMENTS: Alist/Alist.entitlements
    sources:
      - path: Alist
    dependencies:
      - package: Kingfisher
      - package: MarkdownUI
      - package: CodeScanner
      - package: KeychainAccess
      - package: Alamofire
      - target: AlistShareExtension
      - target: AlistWidget
    info:
      path: Alist/Info.plist
      properties:
        CFBundleDisplayName: Alist
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: com.s1mon09.alist
            CFBundleURLSchemes:
              - alistios
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIRequiresPersistentWiFi: true
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.alist.refresh
          - com.alist.upload
          - com.alist.download
  AlistShareExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s1mon09.alist.ShareExtension
        PRODUCT_NAME: AlistShareExtension
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SKIP_INSTALL: YES
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Alist
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
  AlistWidget:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s1mon09.alist.AlistWidget
        PRODUCT_NAME: AlistWidget
        CODE_SIGN_ENTITLEMENTS: Widget/AlistWidget.entitlements
        SKIP_INSTALL: YES
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Alist
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
