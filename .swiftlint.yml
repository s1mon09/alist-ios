# SwiftLint 基础配置（渐进式，不阻断开发）
disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name
  - type_name
  - force_cast
  - force_try
  - function_body_length
  - file_length
  - type_body_length
  - cyclomatic_complexity

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - toggle_bool

included:
  - Alist

excluded:
  - Pods
  - DerivedData

force_unwrapping:
  severity: warning

nesting:
  type_level:
    warning: 3
